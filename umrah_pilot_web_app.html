<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064e3b"><meta name="description" content="คู่มืออุมเราะฮ์แบบออฟไลน์ พร้อมตัวติดตามความคืบหน้า"><link rel="manifest" href="manifest.webmanifest"><title>Umrah Pilot</title>
<style>
:root{--deep:#022c22;--primary:#064e3b;--accent:#10b981;--gold:#d97706;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--danger:#b91c1c}*{box-sizing:border-box}html{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#0f172a;color:var(--text)}body{margin:0;background:var(--bg);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,560px);margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}.top{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:25px}.top h1{font-size:17px;margin:0}.top p{font-size:11px;color:#a7f3d0;margin:2px 0 0}.actions{display:flex;gap:6px}.icon{background:#064e3b;border:1px solid #166534;color:#fff;border-radius:10px;padding:8px;min-width:40px}.banner{margin:12px 16px;background:linear-gradient(135deg,var(--primary),#022c22);color:#fff;border-radius:18px;padding:16px}.banner h2{margin:0 0 4px;font-size:18px}.banner p{margin:0;color:#d1fae5;font-size:12px}.progress{height:10px;background:#d1d5db;border-radius:99px;overflow:hidden;margin:10px 0 6px}.progress>i{display:block;height:100%;background:var(--accent);transition:.3s}.progress-label{font-size:12px;color:#d1fae5}.content{padding:0 16px}.card{background:var(--card);border:1px solid #e2e8f0;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #0f172a0a}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stage{border:1px solid #dbeafe;border-radius:14px;padding:12px;background:#f8fafc;text-align:left}.stage strong{display:block;font-size:13px}.stage span{font-size:11px;color:var(--muted)}.stage.done{background:#ecfdf5;border-color:#6ee7b7}.stage.current{outline:3px solid #fbbf24}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--primary);color:#fff}.btn.secondary{background:#e2e8f0;color:var(--text)}.btn.gold{background:#fef3c7;color:#78350f}.btn.danger{background:#fee2e2;color:var(--danger)}.btn:focus-visible,.icon:focus-visible,.nav button:focus-visible,input:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:13px;border-bottom:1px solid #f1f5f9}.check:last-child{border:0}.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}.counter{text-align:center}.number{font-size:72px;font-weight:800;color:var(--primary);line-height:1}.dots{display:flex;justify-content:center;gap:7px;margin:14px 0}.dot{width:27px;height:27px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-size:12px}.dot.active{background:var(--primary);color:#fff}.dot.done{background:#a7f3d0;color:#064e3b}.hold{width:100%;min-height:76px;position:relative;overflow:hidden}.hold i{position:absolute;inset:0 auto 0 0;width:0;background:#34d39966;transition:width .05s}.hold span{position:relative}.tabs{display:flex;gap:8px;margin:12px 0}.tabs .btn{flex:1}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:flex;background:#fff;border-top:1px solid #cbd5e1;z-index:6;padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px #0f172a15}.nav button{flex:1;border:0;background:none;color:#64748b;font-size:10px;padding:6px 2px;border-radius:10px}.nav button.active{color:var(--primary);font-weight:800;background:#ecfdf5}.nav b{display:block;font-size:18px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:grid;place-items:center;padding:16px}.modal>div{background:#fff;border-radius:20px;padding:18px;width:min(100%,480px);max-height:90vh;overflow:auto}.modal input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;margin:5px 0 12px}.notice{font-size:11px;color:#92400e;background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:10px;margin-top:10px}main[aria-live]{min-height:360px}@media(max-width:380px){.content,.banner{margin-left:10px;margin-right:10px}.content{padding:0}.top{padding-left:10px;padding-right:10px}.number{font-size:62px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><div class="app" id="app"><header class="top"><div class="brand"><span class="logo" aria-hidden="true">🕋</span><div><h1>Umrah Pilot</h1><p>คู่มืออุมเราะฮ์แบบออฟไลน์</p></div></div><div class="actions"><button class="icon" id="installBtn" aria-label="ติดตั้งแอป" hidden>⬇️</button><button class="icon" id="settingsBtn" aria-label="ตั้งค่า">⚙️</button></div></header><section class="banner" aria-labelledby="progressTitle"><h2 id="progressTitle">ความคืบหน้าอุมเราะฮ์</h2><p id="progressText">เริ่มเตรียมตัวให้พร้อม</p><div class="progress" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progressBar"></i></div><div class="progress-label" id="progressPercent">0%</div></section><main id="main" class="content" aria-live="polite"></main><nav class="nav" aria-label="เมนูหลัก"><button data-tab="home" class="active"><b>🏠</b>ภาพรวม</button><button data-tab="miqat"><b>🧳</b>มีกอต</button><button data-tab="tawaf"><b>🕋</b>เฏาะวาฟ</button><button data-tab="sai"><b>🏃</b>สะแอ</button><button data-tab="help"><b>🚨</b>ช่วยเหลือ</button></nav></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div><div class="row"><h2 id="modalTitle">ตั้งค่า</h2><button class="icon" id="closeModal" aria-label="ปิด">✕</button></div><label for="hotel">ชื่อโรงแรม</label><input id="hotel" autocomplete="organization"><label for="phone">เบอร์หัวหน้ากลุ่ม</label><input id="phone" type="tel" autocomplete="tel"><div class="row"><button class="btn" id="saveSettings">บันทึก</button><button class="btn danger" id="resetBtn">เริ่มข้อมูลใหม่</button></div><p class="notice">ข้อมูลศาสนาในแอปเป็นคู่มือเบื้องต้น ความเห็นทางฟิกฮ์อาจแตกต่างกัน โปรดสอบถามผู้รู้ที่ไว้วางใจได้ โดยเฉพาะกรณีอิชติรอต การชดเชย และข้อจำกัดเฉพาะบุคคล</p></div></div>
<script>
'use strict';
const KEY='umrah-pilot-v2';const defaults={gender:'male',hotel:'Swissôtel Makkah',phone:'+66 81-234-5678',miqat:{hygiene:false,ghusl:false,attire:false,perfume:false,prayer:false,niyyah:false},tawaf:0,sai:0,tab:'home'};let state=load();let holdTimer=null,holdStarted=0,holdKind=null,deferredInstall=null;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function overall(){let mi=Object.values(state.miqat).filter(Boolean).length/6;return Math.round((mi+state.tawaf/7+state.sai/7+(state.sai===7?1:0))/3*100)}
function render(){const p=overall();document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressPercent').textContent=p+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',p);document.getElementById('progressText').textContent=p===100?'อุมเราะฮ์เสร็จสิ้นแล้ว':p?'ทำต่อจากความคืบหน้าล่าสุดได้ทุกเมื่อ':'เริ่มจากตรวจรายการมีกอต';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.getElementById('main').innerHTML=views[state.tab]();bind();save()}
const views={home:()=>`<section class="card"><h2>ยินดีต้อนรับ</h2><p class="muted">ระบบบันทึกความคืบหน้าไว้ในเครื่องนี้ ใช้งานต่อได้แม้ไม่มีอินเทอร์เน็ต</p><div class="grid"><button class="stage ${state.miqat.niyyah?'done':''}" data-go="miqat"><strong>1. มีกอต</strong><span>${Object.values(state.miqat).filter(Boolean).length}/6 รายการ</span></button><button class="stage ${state.tawaf===7?'done':''} ${state.tawaf>0&&state.tawaf<7?'current':''}" data-go="tawaf"><strong>2. เฏาะวาฟ</strong><span>${state.tawaf}/7 รอบ</span></button><button class="stage ${state.sai===7?'done':''} ${state.sai>0&&state.sai<7?'current':''}" data-go="sai"><strong>3. สะแอ</strong><span>${state.sai}/7 เที่ยว</span></button><button class="stage ${state.sai===7?'done':''}"><strong>4. ตะฮัลลุล</strong><span>${state.sai===7?'พร้อมทำขั้นตอนสุดท้าย':'หลังสะแอครบ 7 เที่ยว'}</span></button></div></section><section class="card"><h3>ทำต่อจากครั้งล่าสุด</h3><p class="muted">${state.tab==='home'?'เลือกขั้นตอนจากด้านบน':`ขั้นตอนปัจจุบัน: ${state.tab}`}</p><button class="btn" data-go="${state.tawaf<7?'tawaf':state.sai<7?'sai':'miqat'}">ไปต่อ</button><button class="btn secondary" id="resetInline">รีเซ็ตความคืบหน้า</button></section><section class="card"><h3>ข้อควรรู้</h3><p class="muted">เวลาละหมาดและข้อมูลสถานที่อาจเปลี่ยนแปลง ควรตรวจสอบประกาศทางการในพื้นที่</p></section>`,miqat:()=>`<section class="card"><h2>มีกอตและการเตรียมเอียะห์รอม</h2><p class="muted">เพศ: ${state.gender==='male'?'บุรุษ':'สตรี'} — เลือกเพศในตั้งค่าไม่ได้ในรุ่นนี้ ใช้ข้อความที่เหมาะสมกับตนเอง</p>${check('hygiene','ตัดเล็บและจัดการขนให้เรียบร้อยก่อนครองเอียะห์รอม')}${check('ghusl','อาบน้ำและเตรียมความสะอาดร่างกาย')}${check('attire','เตรียมเครื่องแต่งกายเอียะห์รอมให้เหมาะสมกับเพศและหลักปฏิบัติ')}${check('perfume','ใช้น้ำหอมก่อนครองเอียะห์รอมตามหลักที่ผู้รู้แนะนำ และหลีกเลี่ยงหลังเริ่มครอง')}${check('prayer','ละหมาด 2 ร็อกอะฮ์เมื่อสะดวก — ไม่ควรฝืนหากอยู่บนเครื่องบิน')}${check('niyyah','กล่าวเหนียตเมื่อถึงแนวมีกอตตามคำแนะนำของผู้รู้')}<div class="notice">มีกอตและรายละเอียดการแต่งกายมีเงื่อนไขตามสถานการณ์และมัซฮับ ควรยึดคำแนะนำของผู้รู้/หัวหน้ากลุ่ม ไม่ใช้แอปแทนคำวินิจฉัยเฉพาะกรณี</div></section>`,tawaf:counter('เฏาะวาฟ','รอบ',state.tawaf,'จบเฏาะวาฟครบ 7 รอบแล้ว ให้ปฏิบัติตามคู่มือและคำแนะนำของผู้รู้','tawaf'),sai:counter('สะแอ','เที่ยว',state.sai,'เมื่อครบ 7 เที่ยว ให้ทำตะฮัลลุลตามหลักปฏิบัติ','sai'),help:()=>`<section class="card"><h2>บัตรขอความช่วยเหลือ</h2><p class="muted">โรงแรม: ${esc(state.hotel)}<br>หัวหน้ากลุ่ม: ${esc(state.phone)}</p><button class="btn" data-speak="أنا تائه، أرجو مساعدتي في الوصول إلى فندقي">🔊 ฉันหลงทาง กรุณาช่วยฉัน</button><a class="btn secondary" href="tel:997">📞 โทรฉุกเฉินการแพทย์ 997</a><a class="btn secondary" href="tel:911">📞 โทรฉุกเฉิน 911</a><div class="notice">หากมีอาการฉุกเฉิน ให้ขอความช่วยเหลือจากเจ้าหน้าที่ในพื้นที่และโทรหมายเลขฉุกเฉินของซาอุดีอาระเบีย</div></section>`};
function check(k,t){return `<label class="check"><input type="checkbox" data-check="${k}" ${state.miqat[k]?'checked':''}><span>${t}</span></label>`}function counter(title,unit,note,kind){return `<section class="card counter"><h2>${title}</h2><p class="muted">บันทึกแล้ว ${n} จาก 7 ${unit}</p><div class="number" aria-label="${n} จาก 7">${n}</div><div class="dots">${[1,2,3,4,5,6,7].map(i=>`<span class="dot ${i<=n?'done':''} ${i===n+1?'active':''}">${i<=n?'✓':i}</span>`).join('')}</div><button class="btn hold" data-hold="${kind}"><i></i><span>กดค้าง 1 วินาที เพื่อบันทึก${unit}${n<7?'ที่ '+(n+1):'ที่ 7'}</span></button><button class="btn secondary" data-undo="${kind}">↩️ ย้อนกลับ 1 ${unit}</button><p class="muted">${note}</p></section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;render()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{state.miqat[e.dataset.check]=e.checked;render()});document.querySelectorAll('[data-hold]').forEach(e=>{e.onpointerdown=ev=>{ev.preventDefault();holdKind=e.dataset.hold;holdStarted=Date.now();const bar=e.querySelector('i');holdTimer=setInterval(()=>{let x=Math.min((Date.now()-holdStarted)/1000,1);bar.style.width=x*100+'%';if(x>=1){clearInterval(holdTimer);holdTimer=null;state[holdKind]=Math.min(7,state[holdKind]+1);render();if(navigator.vibrate)navigator.vibrate([70,40,70])}},40)};['pointerup','pointercancel','pointerleave'].forEach(x=>e.addEventListener(x,()=>{if(holdTimer){clearInterval(holdTimer);holdTimer=null;render()}}))});document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{state[b.dataset.undo]=Math.max(0,state[b.dataset.undo]-1);render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.getElementById('resetInline')?.addEventListener('click',reset)}
function speak(t){if(!('speechSynthesis'in window))return alert('อุปกรณ์นี้ไม่รองรับเสียงอ่าน');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}function reset(){if(confirm('ต้องการลบความคืบหน้าทั้งหมดหรือไม่?')){state=structuredClone(defaults);render()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.getElementById('settingsBtn').onclick=()=>{hotel.value=state.hotel;phone.value=state.phone;modal.classList.remove('hidden');hotel.focus()};document.getElementById('closeModal').onclick=()=>modal.classList.add('hidden');document.getElementById('saveSettings').onclick=()=>{state.hotel=hotel.value.trim()||defaults.hotel;state.phone=phone.value.trim()||defaults.phone;modal.classList.add('hidden');render()};document.getElementById('resetBtn').onclick=reset;modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(deferredInstall){deferredInstall.prompt();deferredInstall=null;installBtn.hidden=true}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));render();
</script></body></html>
